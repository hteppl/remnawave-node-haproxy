services:
  remnawave-node-haproxy:
    build: .
    image: remnawave-node-haproxy:dev
    container_name: remnawave-node-haproxy
    hostname: remnawave-node-haproxy
    restart: always
    env_file:
      - .env
    network_mode: host
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    logging:
      driver: json-file
      options:
        max-size: '30m'
        max-file: '5'
